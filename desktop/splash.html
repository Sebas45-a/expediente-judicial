<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>Expediente Judicial</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #1d2b4a; color: #f3efe4; -webkit-app-region: drag; user-select: none;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  img { width: 84px; height: 84px; }
  h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: .3px; }
  #msg { font-size: 13px; opacity: .8; min-height: 18px; }
  .barra { width: 220px; height: 3px; background: rgba(255,255,255,.15); border-radius: 2px; overflow: hidden; }
  .barra::after { content: ""; display: block; width: 40%; height: 100%; background: #d4af37; animation: ir 1.2s ease-in-out infinite; }
  @keyframes ir { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>
</head>
<body>
  <img src="recursos/icon.png" alt="">
  <h1>Expediente Judicial</h1>
  <div class="barra"></div>
  <div id="msg">Iniciando…</div>
  <script>window.progreso = (t) => { document.getElementById('msg').textContent = t; };</script>
</body>
</html>
